<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сборщик коробочек</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
  /* Швейцарский минимализм в духе design-dmitriev.github.io: белый лист,
     чёрный шрифт Onest, волосяные линии, нумерованные разделы, одно
     главное действие на экран. Подробности — DESIGN.md. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #0a0a0a;
    --muted: #6b6b6b;
    --line: #e5e5e5;
    --field: #f4f4f4;
    --stage: #e9e6e1;
    --err: #d92d20;
    --side: 400px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }

  /* ---------- раскладка ---------- */
  .app { display: flex; flex-direction: column; min-height: 100dvh; }
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
  #h-size { color: var(--muted); font-variant-numeric: tabular-nums; }
  header p { margin: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  #stage { position: relative; height: 58svh; min-height: 320px; background: var(--stage); overflow: hidden; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #stage.drag::after {
    content: "Отпустите файл макета"; position: absolute; inset: 12px; border: 1.5px dashed var(--ink); border-radius: 12px;
    display: grid; place-items: center; font-weight: 500; background: rgba(255,255,255,.6); pointer-events: none; z-index: 5;
  }
  .hint { display: none; }

  @media (min-width: 900px) {
    body { height: 100dvh; overflow: hidden; }
    .app {
      display: grid; height: 100dvh; min-height: 0;
      grid-template-columns: minmax(0, 1fr) var(--side); grid-template-rows: auto minmax(0, 1fr);
    }
    header { grid-column: 1 / -1; padding: 16px 28px; }
    #stage { height: auto; min-height: 0; }
    .panel { border-left: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; }
    .hint { display: block; position: absolute; right: 20px; top: 18px; color: var(--muted); font-size: 12px; pointer-events: none; }
  }

  /* ---------- управление вскрытием: поверх сцены ---------- */
  .play {
    position: absolute; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 3;
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px;
    padding: 10px 18px 10px 10px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255,255,255,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  @media (min-width: 900px) { .play { left: 50%; right: auto; width: min(640px, calc(100% - 40px)); transform: translateX(-50%); } }
  #play { min-width: 112px; }
  .track { display: grid; gap: 4px; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--ink); height: 20px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 11px; line-height: 1.25; color: var(--muted); }
  .steps span:nth-child(2), .steps span:nth-child(3) { text-align: center; }
  .steps span:last-child { text-align: right; }
  .steps span.on { color: var(--ink); font-weight: 500; }

  .fs-btn {
    position: absolute; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); z-index: 4;
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px 0 14px;
    background: rgba(255,255,255,.88); color: var(--ink); border: 1px solid var(--line); border-radius: 999px;
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .fs-btn:hover { border-color: var(--ink); }
  .fs-btn svg { width: 16px; height: 16px; }
  .fs-exit { display: none; }

  /* ---------- панель настроек ---------- */
  .panel { counter-reset: sec; background: var(--bg); display: flex; flex-direction: column; }
  .sec { padding: 22px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
  @media (min-width: 900px) { .sec { padding: 24px 28px; } }
  .sec-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sec-h {
    counter-increment: sec; margin: 0; display: flex; align-items: baseline; gap: 10px;
    font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em;
  }
  .sec-h::before { content: counter(sec, decimal-leading-zero); color: var(--muted); font-variant-numeric: tabular-nums; }

  /* кнопки */
  button { font: inherit; cursor: pointer; }
  #play, #ex-pdf, #ex-svg {
    min-height: 44px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; font-weight: 500; transition: opacity .2s ease, background .2s ease, color .2s ease;
  }
  #play:hover, #ex-pdf:hover { opacity: .82; }
  button.ghost { background: transparent !important; color: var(--ink) !important; }
  button.ghost:hover { background: var(--ink) !important; color: #fff !important; opacity: 1; }
  button:disabled { opacity: .35 !important; cursor: default; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .link {
    background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: 13px;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line);
    justify-self: start; min-height: 32px; font-variant-numeric: tabular-nums;
  }
  .link:hover { color: var(--ink); text-decoration-color: var(--ink); }
  #p-reset::before { content: "↺ Сбросить: "; }

  /* тип коробки — вертикальный список, одно выбранное */
  .seg { display: grid; gap: 6px; }
  .seg button {
    text-align: left; min-height: 48px; padding: 0 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px;
    display: flex; align-items: center; justify-content: space-between; transition: border-color .15s ease;
  }
  .seg button::after { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
  .seg button:hover { border-color: var(--ink); }
  .seg button[aria-pressed="true"] { border-color: var(--ink); }
  .seg button[aria-pressed="true"]::after { border: 5px solid var(--ink); }

  /* размеры */
  .fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; }
  .num { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  .num input {
    width: 100%; min-height: 48px; padding: 0 12px; border-radius: 10px;
    border: 1px solid transparent; background: var(--field); color: var(--ink);
    font: inherit; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  }
  .num input::-webkit-outer-spin-button, .num input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .num input:hover { border-color: var(--line); }
  .num input:focus { border-color: var(--ink); background: var(--bg); outline: none; }
  .num input.bad { border-color: var(--err); background: #fff5f4; }
  .derived { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; font-variant-numeric: tabular-nums; }

  /* чекбоксы — строки на всю ширину */
  .checks { display: grid; }
  .chk {
    display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; font-size: 15px;
    border-top: 1px solid var(--line);
  }
  .checks .chk:first-child { border-top: 0; }
  .chk input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); flex: none; }

  /* загрузка макета */
  .up {
    position: relative; display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer;
    border: 1px dashed #c9c9c9; border-radius: 12px; transition: border-color .15s ease, background .15s ease;
  }
  .up:hover, .up:focus-within { border-color: var(--ink); background: var(--field); }
  .up input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .up-t { display: grid; gap: 2px; }
  .up-t b { font-weight: 500; }
  .up-t small { color: var(--muted); font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .up.done { border-style: solid; border-color: var(--ink); }
  .up.done .dot { background: var(--ink); }

  /* экспорт — всегда на виду внизу панели */
  .export {
    position: sticky; bottom: 0; z-index: 2; margin-top: auto; border-bottom: 0; border-top: 1px solid var(--line);
    background: var(--bg); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  @media (max-width: 899px) { .export { position: static; } }
  .ex-btns { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .export .chk { border-top: 0; min-height: 36px; font-size: 14px; }
  #status { margin: 0; color: var(--muted); font-size: 12.5px; min-height: 1.2em; }
  #status:empty { display: none; }
  #status.err { color: var(--err); }

  /* ---------- телефон ---------- */
  @media (max-width: 560px) {
    header { padding-left: 16px; padding-right: 16px; }
    .sec { padding: 20px 16px; }
    .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .play { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); gap: 12px; padding: 8px 14px 8px 8px; }
    #play { min-width: 96px; padding: 0 16px; }
    .steps { font-size: 10px; }
    .steps span:nth-child(2), .steps span:nth-child(3) { display: none; }
    .steps { grid-template-columns: 1fr 1fr; }
    .fs-btn span { display: none; }
    .fs-btn { width: 44px; min-height: 44px; padding: 0; justify-content: center; }
  }

  /* ---------- полноэкранный 3D ---------- */
  body.full { overflow: hidden; }
  body.full header, body.full .panel, body.full .hint, body.full .fs-enter { display: none; }
  body.full #stage { position: fixed; inset: 0; z-index: 10; height: 100dvh; min-height: 0; }
  body.full .fs-exit { display: inline-flex; }
  body.full .fs-exit span { display: inline; }
  body.full .fs-exit { width: auto; padding: 0 16px 0 14px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="app">
<header>
  <h1>Сборщик коробочек <span id="h-size"></span></h1>
  <p id="h-info"></p>
</header>

<div id="stage">
  <button type="button" class="fs-btn fs-enter" id="fs-on" aria-label="Смотреть 3D на весь экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>На весь экран</span></button>
  <button type="button" class="fs-btn fs-exit" id="fs-off" aria-label="Выйти из полноэкранного режима"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Закрыть</span></button>
  <span class="hint">Тянуть — вращать · колесо / щипок — масштаб · макет можно перетащить сюда</span>

  <div class="play">
    <button id="play" type="button">Открыть</button>
    <div class="track">
      <input id="t" type="range" min="0" max="1000" value="0" aria-label="Этап вскрытия">
      <div class="steps" id="steps"><span class="on">В коробке</span><span>Вытягиваем за вырезы</span><span>Коробка извлечена</span><span>Крышка снята</span></div>
    </div>
  </div>
</div>

<aside class="panel">
  <section class="sec">
    <h2 class="sec-h">Тип коробки</h2>
    <div class="seg" id="types" role="group" aria-label="Тип коробки">
      <button type="button" data-type="sleeve" aria-pressed="true">Футляр + крышка-дно</button>
      <button type="button" data-type="tuck" aria-pressed="false">С язычками (RTE)</button>
      <button type="button" data-type="tele" aria-pressed="false">Крышка-дно</button>
      <button type="button" data-type="wedge" aria-pressed="false">Клин (трапеция)</button>
    </div>
  </section>

  <section class="sec">
    <div class="sec-top">
      <h2 class="sec-h">Размер</h2>
      <button class="link" id="p-reset" type="button" title="Вернуть размеры по умолчанию">85 × 150 × 20</button>
    </div>
    <div class="fields">
      <label class="num" id="f-W"><span>Ширина, мм</span><input id="p-W" type="number" step="0.5" min="6" max="2000" inputmode="decimal"></label>
      <label class="num" id="f-L"><span>Высота, мм</span><input id="p-L" type="number" step="0.5" min="7" max="2000" inputmode="decimal"></label>
      <label class="num" id="f-D"><span>Толщина, мм</span><input id="p-D" type="number" step="0.5" min="6" max="2000" inputmode="decimal"></label>
      <label class="num" id="f-nw"><span>Вырез ш., мм</span><input id="p-nw" type="number" step="0.5" min="0" max="80" inputmode="decimal"></label>
      <label class="num" id="f-nh"><span>Вырез гл., мм</span><input id="p-nh" type="number" step="0.5" min="0" max="40" inputmode="decimal"></label>
      <label class="num" id="f-th"><span>Картон, мм</span><input id="p-th" type="number" step="0.1" min="0.2" max="3" inputmode="decimal"></label>
      <label class="num" id="f-to"><span>Картон внеш., мм</span><input id="p-to" type="number" step="0.1" min="0.2" max="3" inputmode="decimal"></label>
      <label class="num" id="f-tp"><span>Глубина сверху, мм</span><input id="p-tp" type="number" step="0.5" min="6" max="400" inputmode="decimal"></label>
      <label class="num" id="f-dh"><span>Бок. клапаны, мм</span><input id="p-dh" type="number" step="0.5" min="3" max="200" inputmode="decimal"></label>
    </div>
    <p class="derived" id="derived"></p>
  </section>

  <section class="sec">
    <h2 class="sec-h">Вид</h2>
    <div class="checks">
      <label class="chk" id="f-hanger"><input type="checkbox" id="hanger" checked><span>Европодвес</span></label>
      <label class="chk"><input type="checkbox" id="blackboard"><span>Чёрный картон внутри</span></label>
      <label class="chk" id="f-closedbot"><input type="checkbox" id="closedbot"><span>Дно-замок 1-2-3 (не открывается)</span></label>
      <label class="chk" id="f-zones"><input type="checkbox" id="zones" checked><span>Зоны под стрелки</span></label>
    </div>
  </section>

  <section class="sec">
    <h2 class="sec-h">Дизайн</h2>
    <label class="up" id="up-sheet"><span class="dot"></span><span class="up-t"><b>Загрузить макет</b><small>PDF, PNG, JPG, SVG — или перетащите на коробку</small></span><input type="file" accept=".pdf,.png,.jpg,.jpeg,.svg,.webp" id="file"></label>
    <button class="link" id="reset" type="button">Убрать дизайн</button>
  </section>

  <section class="sec export">
    <h2 class="sec-h">Развёртка</h2>
    <div class="ex-btns">
      <button id="ex-pdf" type="button">Скачать PDF</button>
      <button class="ghost" id="ex-svg" type="button">SVG</button>
    </div>
    <label class="chk"><input type="checkbox" id="ex-design"><span>С текущим дизайном</span></label>
    <p id="status" role="status"></p>
  </section>
</aside>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/clipper.js"></script>

  const status = document.getElementById('status');
  const say = (msg, err) => { status.textContent = msg; status.classList.toggle('err', !!err); };
  const fmt = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
  const f1 = v => (Math.round(v * 10) / 10).toString();

  // ================= geometry helpers (Clipper) =================
  const CL = ClipperLib, SC = 1000;
  const P = pts => pts.map(([x, y]) => ({ X: Math.round(x * SC), Y: Math.round(y * SC) }));
  const rect = (x0, y0, x1, y1) => P([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]);
  function arc(cx, cy, r, a0, a1, n = 12) {
    const out = [];
    for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
    return out;
  }
  const circle = (cx, cy, r, n = 40) => P(arc(cx, cy, r, 0, 360, n).slice(0, -1));
  function boolOp(type, subj, clip, strict = true) {
    const c = new CL.Clipper(); c.StrictlySimple = strict;
    c.AddPaths(subj, CL.PolyType.ptSubject, true);
    if (clip) c.AddPaths(clip, CL.PolyType.ptClip, true);
    const sol = new CL.Paths();
    c.Execute(type, sol, CL.PolyFillType.pftNonZero, CL.PolyFillType.pftNonZero);
    return sol;
  }
  const union = paths => boolOp(CL.ClipType.ctUnion, paths);
  // Для деталей под углом (клин): строгий режим на косых общих рёбрах не склеивает соседние детали.
  const unionLoose = paths => boolOp(CL.ClipType.ctUnion, paths, null, false);
  const diff = (a, b) => boolOp(CL.ClipType.ctDifference, a, b);
  function offset(paths, d) {
    const co = new CL.ClipperOffset(3, 0.05 * SC);
    co.AddPaths(paths, CL.JoinType.jtMiter, CL.EndType.etClosedPolygon);
    const sol = new CL.Paths(); co.Execute(sol, d * SC); return sol;
  }
  const d = paths => paths.map(p => 'M' + p.map(q => (q.X / SC).toFixed(3) + ',' + (q.Y / SC).toFixed(3)).join(' L') + ' Z').join(' ');
  const segs = s => s.map(([a, b, c, e]) => `M${a.toFixed(3)},${b.toFixed(3)} L${c.toFixed(3)},${e.toFixed(3)}`).join(' ');

  function euro(cx, cy, flip) {
    const s = flip ? -1 : 1;
    return union([rect(cx - 13, cy - 3, cx + 13, cy + 3), circle(cx - 13, cy, 3), circle(cx + 13, cy, 3), circle(cx, cy - 3 * s, 5)]);
  }
  function dustDown(x, y, w, h) {
    return P([[x, y], [x + 1.5, y + 4], [x + 4, y + h], [x + w - 3, y + h], [x + w - 0.5, y + 6], [x + w, y]]);
  }

  // ================= parameters =================
  function derive(p) {
    // Толщина картона: внутренней коробки (крышка + дно) и внешнего футляра.
    const cl = (v, d) => isFinite(v) ? Math.min(Math.max(v, 0.2), 3) : d;
    const tI = cl(p.th, 0.4), tO = cl(p.to, 0.4);
    const LID = [p.W + 2 * tI + 0.6, p.L + 2 * tI + 0.6, p.D];
    const BASE = [p.W, p.L, p.D];
    const OUT = [LID[0] + 2 * tO + 1.2, p.D + 2 * tO + 1.2, LID[1] + tO + 1.6];
    const hangW = Math.min(50, OUT[0] - 6);
    const hangOK = hangW >= 40;
    const nw = Math.max(0, Math.min(p.nw, OUT[1] - 4));
    const nh = Math.max(0, Math.min(p.nh, 40, OUT[2] / 3));
    const gap = OUT[2] - (tO + 0.5 + LID[1]);
    return { ...p, tI, tO, LID, BASE, OUT, hangW, hangOK, nw, nh, gap, zh: Math.max(0, nh - gap) };
  }

  // ================= dieline pieces =================
  function sleeve(q, x0, yT, hanger) {
    const [W, D, H] = q.OUT;
    const xB = x0, xS1 = x0 + W, xF = x0 + W + D, xS2 = x0 + 2 * W + D, xG = x0 + 2 * W + 2 * D, yB = yT + H;
    const parts = [rect(xB, yT, xG, yB), P([[xG, yT], [xG + GLUE, yT + 10], [xG + GLUE, yB - 10], [xG, yB]]),
      rect(xB, yB, xB + W, yB + D - 0.5), rect(xF, yB, xF + W, yB + D - 0.5),
      dustDown(xS1, yB, D, DUST), dustDown(xS2, yB, D, DUST)];
    const creases = [[xB, yB, xB + W, yB], [xS1, yB, xS1 + D, yB], [xF, yB, xF + W, yB], [xS2, yB, xS2 + D, yB],
      ...[xS1, xF, xS2, xG].map(x => [x, yT, x, yB])];
    const options = [], holes = [], labels = [];
    const hw = q.hangW, hx = xB + (W - hw) / 2;
    const rects = { back: [xB, yT, W, H], s1: [xS1, yT, D, H], front: [xF, yT, W, H], s2: [xS2, yT, D, H],
      bottomFront: [xF, yB, W, D - 0.5], bottomBack: [xB, yB, W, D - 0.5] };
    if (hanger) {
      const r = 6;
      parts.push(P([[hx, yT], ...arc(hx + r, yT - 2 * HANG_H + r, r, 180, 270), ...arc(hx + hw - r, yT - 2 * HANG_H + r, r, 270, 360), [hx + hw, yT]]));
      creases.push([hx, yT - HANG_H, hx + hw, yT - HANG_H]);
      options.push([hx, yT, hx + hw, yT]);
      holes.push(...euro(xB + W / 2, yT - 14, false), ...euro(xB + W / 2, yT - HANG_H - 14, true));
      rects.hangLow = [hx, yT - HANG_H, hw, HANG_H]; rects.hangUp = [hx, yT - 2 * HANG_H, hw, HANG_H];
    }
    const notches = q.nw > 0 && q.nh > 0 ? [xS1, xS2].map(x => rect(x + D / 2 - q.nw / 2, yT - 5, x + D / 2 + q.nw / 2, yT + q.nh)) : [];
    let outline = union(parts);
    if (notches.length) outline = diff(outline, notches);
    const bleed = offset(outline, BLEED);
    const printFill = diff(bleed, [rect(xG, yT - 300, xG + 60, yB + 300)]);
    const sideP = (x0s, x1s, n) => n ? diff([rect(x0s, yT, x1s, yB)], [n]) : [rect(x0s, yT, x1s, yB)];
    const panels = [[rect(xB, yT, xS1, yB)], [rect(xF, yT, xF + W, yB)], sideP(xS1, xF, notches[0]), sideP(xS2, xG, notches[1])].map(pp => offset(pp, -SAFE));
    const L = (x, y, s, size, rot, fill) => labels.push({ x, y, s, size, rot: rot || 0, fill: fill || COL.label });
    [[xB, 'ЗАДНЯЯ'], [xF, 'ЛИЦЕВАЯ']].forEach(([xp, t]) => { L(xp + W / 2, yT + H / 2, t, 6); L(xp + W / 2, yT + H / 2 + 7, `${f1(W)} × ${f1(H)}`, 3.5); });
    [xS1, xS2].forEach(x => { L(x + D / 2 + 1.5, yT + H / 2, `БОК ${f1(D)} × ${f1(H)}`, 4, -90); if (notches.length) L(x + D / 2, yT + q.nh + 5, 'вырез', 2.3); });
    L(xG + GLUE / 2 + 1.5, yT + H / 2, 'КЛЕЙ', 3.5, -90);
    L(xF + W / 2, yT + 6, 'ВЕРХ открыт — внутр. коробка заподлицо', 3);
    L(xB + W / 2, yB + D / 2 + 1, 'ДНО — склеить', 3.2); L(xF + W / 2, yB + D / 2 + 1, 'ДНО — склеить', 3.2);
    if (hanger) {
      L(xB + W / 2, yT - 3.5, 'европодвес', 2.8); L(xB + W / 2, yT - HANG_H + 4.5, 'линия подгиба, клей', 2.5);
      L(xB + W / 2, yT + 4.5, 'опция: биговка для складного подвеса', 2.5, 0, COL.opt);
    }
    return { outline, bleed, printFill, holes, creases, options, panels, labels, rects, zones: [] };
  }

  function tray(q, xL, yT, dims, title, isLid) {
    const [Wd, Lh, h] = dims;
    const xR = xL + Wd, yB = yT + Lh, ih = h - 1;
    const parts = [rect(xL, yT, xR, yB), rect(xL, yT - h, xR, yT), rect(xL, yB, xR, yB + h), rect(xL - h, yT, xL, yB), rect(xR, yT, xR + h, yB),

    }
    const url = URL.createObjectURL(file);
    try { return await urlToCanvas(url, name.endsWith('.svg')); } finally { URL.revokeObjectURL(url); }
  }
  function urlToCanvas(url, isSvg) {
    return new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => {
        let w = i.naturalWidth || 1000, h = i.naturalHeight || 1000;
        if (isSvg) { const k = 5000 / Math.max(w, h); w *= k; h *= k; }
        const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(i, 0, 0, c.width, c.height);
        res(c);
      };
      i.onerror = () => rej(new Error('не удалось открыть изображение'));
      i.src = url;
    });
  }
  // ---- remember the last uploaded layout in this browser only (IndexedDB) ----
  const idb = () => new Promise((res, rej) => {
    const r = indexedDB.open('box3d', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function kv(mode, fn) {
    const db = await idb();
    return new Promise((res, rej) => { const tx = db.transaction('kv', mode); const q = fn(tx.objectStore('kv')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); });
  }
  async function rememberDesign(canvas, p, name) {
    try {
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
      await kv('readwrite', st => st.put({ blob, params: p, name, hanger: hangerOn(), at: Date.now() }, dkey()));
    } catch (e) { /* storage unavailable: works without it */ }
  }
  const dkey = () => boxType === 'sleeve' ? 'design' : 'design_' + boxType;
  async function forgetDesign() { try { await kv('readwrite', st => st.delete(dkey())); } catch (e) { /* ignore */ } }
  async function restoreDesign() {
    try {
      const rec = await kv('readonly', st => st.get(dkey()));
      if (!rec || !rec.blob) return;
      const url = URL.createObjectURL(rec.blob);
      const c = await urlToCanvas(url, false); URL.revokeObjectURL(url);
      const p = { ...DEF, ...rec.params };
      setDesign(c, sheetAny(p), `Открыт ваш последний макет «${rec.name || 'макет'}» (сделан под ${fmt(p.W)} × ${fmt(p.L)} × ${fmt(p.D)}). Он хранится только в этом браузере.`);
    } catch (e) { /* nothing stored or storage blocked */ }
  }
  function setDesign(canvas, sh, msg) {
    design = { canvas, sheet: sh };
    document.getElementById('up-sheet').classList.add('done');
    repaint(); say(msg);
  }
  async function applyFile(file) {
    say('Загружаю «' + file.name + '»…');
    try {
      const c = await fileToCanvas(file), sh = sheetAny(params);
      rememberDesign(c, { ...params }, file.name);
      const dA = Math.abs((c.width / c.height) / (sh.TW / sh.TH) - 1);
      setDesign(c, sh, `«${file.name}» наложен на размер ${fmt(params.W)} × ${fmt(params.L)} × ${fmt(params.D)}.` +
        (dA > 0.03 ? ` Пропорции файла отличаются от листа развёртки на ${Math.round(dA * 100)}% — артборд должен быть ${fmt(sh.TW)} × ${fmt(sh.TH)} мм (как в скачанном SVG/PDF).` : ''));
      if (dA > 0.03) status.classList.add('err');
    } catch (e) { say('Не получилось: ' + e.message + '. Попробуйте экспорт в PNG.', true); }
  }
  const fileIn = document.getElementById('file');
  fileIn.addEventListener('change', () => { if (fileIn.files[0]) applyFile(fileIn.files[0]); fileIn.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.remove('drag'); }));
  stage.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) applyFile(f); });
  document.getElementById('reset').addEventListener('click', () => {
    design = null; forgetDesign(); document.getElementById('up-sheet').classList.remove('done'); repaint(); say('Дизайн убран.');
  });

  // ================= export =================
  let dl = null;
  (async () => { try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; } })();
  async function saveFile(filename, data) {
    if (dl) {
      try { await dl.save({ filename, data }); say(`Файл ${filename} сохранён.`); }
      catch (e) { say(e && e.code === 'declined' ? 'Сохранение отменено.' : 'Не удалось сохранить: ' + (e && (e.message || e.code)), e && e.code !== 'declined'); }
      return;
    }
    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith('.svg') ? 'image/svg+xml' : 'application/pdf' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    say(`Файл ${filename} подготовлен.`);
  }
  function designImages(key, pc) {
    if (!document.getElementById('ex-design').checked || !design) return '';
    const srcKey = key; const src = design.sheet.pieces[srcKey]; if (!src) return '';
    const c = design.canvas, kx = c.width / design.sheet.TW, ky = c.height / design.sheet.TH;
    return Object.entries(pc.rects).map(([rn, r]) => {
      const s = src.rects[rn]; if (!s) return '';
      if (!Array.isArray(r) || !Array.isArray(s)) {
        const RI = z => Array.isArray(z) ? { o: [z[0], z[1]], u: [1, 0], v: [0, 1], w: z[2], h: z[3] } : z;
        const RR = RI(r), SS = RI(s), c2 = document.createElement('canvas');
        c2.width = Math.max(1, Math.round(RR.w * 12)); c2.height = Math.max(1, Math.round(RR.h * 12));
        const g2 = c2.getContext('2d'), sx = c2.width / SS.w, sy = c2.height / SS.h;
        g2.transform(SS.u[0] * sx / kx, SS.v[0] * sy / kx, SS.u[1] * sx / ky, SS.v[1] * sy / ky,
          -(SS.o[0] * SS.u[0] + SS.o[1] * SS.u[1]) * sx, -(SS.o[0] * SS.v[0] + SS.o[1] * SS.v[1]) * sy);
        g2.drawImage(c, 0, 0);
        return `<image x="0" y="0" width="${RR.w.toFixed(3)}" height="${RR.h.toFixed(3)}" transform="matrix(${RR.u[0].toFixed(5)} ${RR.u[1].toFixed(5)} ${RR.v[0].toFixed(5)} ${RR.v[1].toFixed(5)} ${RR.o[0].toFixed(3)} ${RR.o[1].toFixed(3)})" preserveAspectRatio="none" href="${c2.toDataURL('image/jpeg', 0.9)}"/>`;
      }
      const cc = document.createElement('canvas');
      cc.width = Math.max(1, Math.round(r[2] * 12)); cc.height = Math.max(1, Math.round(r[3] * 12));
      cc.getContext('2d').drawImage(c, s[0] * kx, s[1] * ky, s[2] * kx, s[3] * ky, 0, 0, cc.width, cc.height);
      return `<image x="${r[0].toFixed(3)}" y="${r[1].toFixed(3)}" width="${r[2].toFixed(3)}" height="${r[3].toFixed(3)}" preserveAspectRatio="none" href="${cc.toDataURL('image/jpeg', 0.9)}"/>`;
    }).join('');
  }
  const baseName = () => `${({ tuck: closedBot() ? 'korobka-yazychok-dno-zamok' : 'korobka-yazychki', tele: 'kryshka-dno', wedge: 'korobka-klin', sleeve: 'futlyar' })[boxType]}_${f1(params.W)}x${f1(params.L)}x${f1(params.D)}`.replace(/\./g, ',');
  document.getElementById('ex-svg').addEventListener('click', () => {
    const sh = sheetAny(params);
    saveFile(baseName() + '.svg', buildSVG(sh, { design: designImages }));
  });
  let pdfLibs = null;
  const loadPdfLibs = () => pdfLibs || (pdfLibs = loadScript('vendor/jspdf.umd.min.js')
    .then(() => loadScript('vendor/svg2pdf.umd.min.js')).catch(e => { pdfLibs = null; throw e; }));
  document.getElementById('ex-pdf').addEventListener('click', async e => {
    const btn = e.currentTarget; btn.disabled = true; say('Собираю PDF…');
    try {
      await loadPdfLibs();
      const sh = sheetAny(params);
      const svgText = buildSVG(sh, { design: designImages, font: 'LibSans' });
      const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-99999px;top:0;width:10px;height:10px;overflow:hidden';
      host.innerHTML = svgText; document.body.appendChild(host);
      const el = host.querySelector('svg');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: [sh.TW, sh.TH], orientation: sh.TW > sh.TH ? 'l' : 'p', compress: true });
      doc.addFileToVFS('LibSans.ttf', FONT_B64);
      doc.addFont('LibSans.ttf', 'LibSans', 'normal'); doc.addFont('LibSans.ttf', 'LibSans', 'bold');
      doc.setFont('LibSans');
      // Каждый слой рисуется отдельно и оборачивается в маркеры Optional Content
      // (BDC/EMC), чтобы в Acrobat/Illustrator они были настоящими слоями PDF.
      const layerEls = [...el.children].filter(c => c.tagName.toLowerCase() === 'g' && SVG_LAYERS.includes(c.id));
      const ocg = [];
      doc.internal.events.subscribe('putResources', () => {
        layerEls.forEach(g => { ocg.push(doc.internal.newObject()); doc.internal.write(`<< /Type /OCG /Name (${g.id}) >>`); doc.internal.write('endobj'); });
      });
      doc.internal.events.subscribe('putXobjectDict', () => {
        doc.internal.write('>>'); doc.internal.write('/Properties <<');
        ocg.forEach((id, i) => doc.internal.write(`/OC${i} ${id} 0 R`));
      });
      doc.internal.events.subscribe('putCatalog', () => {
        const refs = ocg.map(id => `${id} 0 R`).join(' ');
        doc.internal.write('/Version /1.5');
        doc.internal.write(`/OCProperties << /OCGs [${refs}] /D << /Name (Layers) /Order [${refs}] /ON [${refs}] >> >>`);
      });
      for (let i = 0; i < layerEls.length; i++) {
        const sub = el.cloneNode(false); sub.appendChild(layerEls[i].cloneNode(true)); host.appendChild(sub);
        doc.internal.write(`/OC /OC${i} BDC`);
        await doc.svg(sub, { x: 0, y: 0, width: sh.TW, height: sh.TH });
        doc.internal.write('EMC');
      }
      host.remove();
      await saveFile(baseName() + '.pdf', doc.output('blob'));
    } catch (err) { say('PDF не собрался: ' + err.message + '. Скачайте SVG — он откроется в Illustrator.', true); }
    btn.disabled = false;
  });

  // ================= fullscreen =================
  function setFull(on) {
    document.body.classList.toggle('full', on);
    const el = document.documentElement;
    try {
      if (on && !document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
      if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    } catch (e) { /* fullscreen API unavailable: CSS mode still works */ }
    setTimeout(resize, 60); setTimeout(() => { resize(); if (on && dims) frame(); }, 350);
  }
  document.getElementById('fs-on').addEventListener('click', () => setFull(true));
  document.getElementById('fs-off').addEventListener('click', () => setFull(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('full')) setFull(false); });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('full')) setFull(false); });

  // ================= start =================
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  applyTypeUI();
  build(params, false);
  restoreDesign().then(() => { if (!design) say('Загрузите макет — он ляжет на коробку и запомнится в этом браузере.'); });
  let last = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (target !== null) {
      const dir = Math.sign(target - t);
      t = Math.max(0, Math.min(1, t + dir * dt / 3.2));
      if ((dir > 0 && t >= target) || (dir < 0 && t <= target)) { t = target; target = null; }
      slider.value = t * 1000; pose(t); label();
    }
    controls.update();
    renderer.render(scene, camera);
  });
})();
</script>
